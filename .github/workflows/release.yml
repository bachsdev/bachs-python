name: Release

# Publishes bachs to PyPI when a version tag (for example v1.0.0) is pushed.
# Authentication uses PyPI trusted publishing (OIDC), so no PyPI token is stored
# in this repository. The project's trusted publisher on pypi.org must name this
# repository, this workflow file and the "pypi" environment.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check the tag matches pyproject.toml
        run: |
          version="v$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml $version" >&2
            exit 1
          fi

      - name: Install the package and dev tools
        run: python -m pip install -e ".[dev]" build

      - name: Lint, check types and run tests
        run: |
          ruff check src tests scripts
          mypy
          pytest

      - name: Build the sdist and wheel
        run: python -m build --outdir dist

      - name: Verify package contents
        run: python scripts/verify_package.py dist

      - name: Keep the built files for publishing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Only this job can request a PyPI token, and it runs nothing from the repository.
  # pip skips pre-releases such as 1.1.0rc1 unless asked for with --pre.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/bachs/
    permissions:
      id-token: write
    steps:
      - name: Download the built files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
